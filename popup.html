<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProcrastiNO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131c;
      --surface2: #1c1c2a;
      --border: #2a2a3d;
      --accent: #ff3b5c;
      --accent2: #ff6b35;
      --ok: #30d158;
      --text: #f0f0f5;
      --muted: #888899;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a0a1e 0%, #0d0d1a 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 18px 14px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -20px; right: -20px;
      width: 80px; height: 80px;
      background: radial-gradient(circle, #ff3b5c22, transparent);
      border-radius: 50%;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .logo-icon {
      font-size: 22px;
      line-height: 1;
    }
    .logo-text {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .logo-text span { color: var(--accent); }
    .tagline {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-left: 30px;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .toggle-label {
      font-weight: 600;
      font-size: 13px;
    }
    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-right: 7px;
      background: var(--muted);
      box-shadow: none;
      transition: all 0.3s;
    }
    .status-dot.active {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
      animation: blink 2s ease infinite;
    }
    @keyframes blink {
      50% { opacity: 0.6; }
    }

    .toggle {
      position: relative;
      width: 44px; height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 24px;
      cursor: pointer;
      transition: 0.3s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 2px; top: 2px;
      background: var(--muted);
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle input:checked + .toggle-slider {
      background: #1a3320;
      border-color: var(--ok);
    }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    /* Body */
    .body { padding: 14px 18px; }

    .field-group { margin-bottom: 12px; }
    .field-label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 8px 11px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field-input:focus { border-color: var(--accent); }
    .field-input::placeholder { color: var(--muted); }

    /* Stats */
    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-number {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .stat-number.ok { color: var(--ok); }
    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Escalation bar */
    .escalation-section { margin-bottom: 14px; }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .escalation-steps {
      display: flex;
      gap: 4px;
    }
    .step {
      flex: 1;
      height: 28px;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
      position: relative;
      overflow: hidden;
    }
    .step::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .step[data-level="0"]::after { background: #4cc9f022; }
    .step[data-level="1"]::after { background: #ff950022; }
    .step[data-level="2"]::after { background: #ff3b3022; }
    .step[data-level="3"]::after { background: #bf5af222; }
    .step[data-level="4"]::after { background: #ff000022; }
    .step.active::after { opacity: 1; }
    .step .step-icon { z-index: 1; font-size: 13px; }

    /* Sites list */
    .sites-toggle {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0;
      margin-bottom: 8px;
      font-family: 'Inter', sans-serif;
    }
    .sites-toggle:hover { color: var(--text); }
    .sites-list {
      display: none;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
    }
    .sites-list.open { display: flex; }
    .site-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 10px;
      color: var(--muted);
    }

    .test-btn {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 12px;
      padding: 8px;
      cursor: pointer;
      margin-top: 7px;
      transition: all 0.2s;
    }
    .test-btn:hover { border-color: #4cc9f0; color: #4cc9f0; }

    /* Save button */
    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13px;
      padding: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.5px;
    }
    .save-btn:hover { opacity: 0.9; }
    .save-btn:active { transform: scale(0.98); }

    /* Saved notice */
    .saved-notice {
      text-align: center;
      color: var(--ok);
      font-size: 11px;
      margin-top: 6px;
      height: 14px;
      transition: opacity 0.3s;
    }

    /* Active tab alert */
    .active-tabs {
      background: #1a0a0a;
      border: 1px solid #ff3b3055;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
    }
    .active-tabs.visible { display: block; }
    .active-tabs-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .active-tabs-list {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <span class="logo-icon">🚫</span>
    <span class="logo-text">Procrastino<span>!</span></span>
  </div>
  <div class="tagline">Anti-procrastination engine</div>
</div>

<div class="toggle-row">
  <span class="toggle-label">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusLabel">Désactivé</span>
  </span>
  <label class="toggle">
    <input type="checkbox" id="enabledToggle">
    <span class="toggle-slider"></span>
  </label>
</div>

<div class="body">

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-number" id="statTabs">0</div>
      <div class="stat-label">Sites détectés</div>
    </div>
    <div class="stat-card">
      <div class="stat-number ok" id="statSites">18</div>
      <div class="stat-label">Sites bloqués</div>
    </div>
  </div>

  <div class="active-tabs" id="activeTabsBox">
    <div class="active-tabs-title">⚠️ Procrastination en cours !</div>
    <div class="active-tabs-list" id="activeTabsList"></div>
  </div>

  <div class="escalation-section">
    <div class="section-title">Niveaux d'alerte</div>
    <div class="escalation-steps">
      <div class="step" data-level="0"><span class="step-icon">😊</span></div>
      <div class="step" data-level="1"><span class="step-icon">😤</span></div>
      <div class="step" data-level="2"><span class="step-icon">😡</span></div>
      <div class="step" data-level="3"><span class="step-icon">🔥</span></div>
      <div class="step" data-level="4"><span class="step-icon">💀</span></div>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label" for="taskInput">📋 Ma tâche actuelle</label>
    <input class="field-input" id="taskInput" type="text" placeholder="Ex: Finir le rapport, préparer la démo...">
  </div>

  <div class="field-group">
    <label class="field-label" for="nameInput">👤 Mon prénom (pour les messages)</label>
    <input class="field-input" id="nameInput" type="text" placeholder="Ton prénom...">
  </div>

  <button class="sites-toggle" id="sitesToggle">▶ Sites surveillés</button>
  <div class="sites-list" id="sitesList">
    <span class="site-tag">youtube</span>
    <span class="site-tag">reddit</span>
    <span class="site-tag">twitter/X</span>
    <span class="site-tag">instagram</span>
    <span class="site-tag">tiktok</span>
    <span class="site-tag">facebook</span>
    <span class="site-tag">twitch</span>
    <span class="site-tag">netflix</span>
    <span class="site-tag">9gag</span>
    <span class="site-tag">imgur</span>
    <span class="site-tag">pinterest</span>
    <span class="site-tag">discord</span>
    <span class="site-tag">+ 6 autres</span>
  </div>

  <button class="save-btn" id="saveBtn">💾 Enregistrer les paramètres</button>
  <button class="test-btn" id="testBtn">🧪 Tester l'extension maintenant</button>
  <div class="saved-notice" id="savedNotice"></div>

</div>

<script src="popup.js"></script>
</body>
</html>
